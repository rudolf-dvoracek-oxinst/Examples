syntax = "proto3";

package sila2.examples.temperature.v1;

option csharp_namespace = "Sila2.Examples.Temperature.V1";

import "google/protobuf/empty.proto";

// Temperature Feature
service TemperatureFeature {
  rpc GetFeatureDefinition(google.protobuf.Empty) returns (TemperatureFeatureDefinition);

  // Command: single measurement
  rpc MeasureTemperature(google.protobuf.Empty) returns (TempExecutionInfo);

  // Query execution (for async style; here immediate success)
  rpc GetExecutionInfo(TempExecutionReference) returns (TempExecutionInfo);

  // Property: current temperature
  rpc GetCurrentTemperature(google.protobuf.Empty) returns (TemperatureReading);

  // Event: continuous updates
  rpc SubscribeTemperatureUpdated(google.protobuf.Empty) returns (stream TemperatureReading);
}

message TemperatureFeatureDefinition {
  string feature_name = 1;
  repeated string commands = 2;
  repeated string properties = 3;
  repeated string events = 4;
}

message TemperatureReading {
  double value_celsius = 1;
  int64 timestamp_unix_ms = 2;
}

enum TempExecutionState {
  TEMP_EXECUTION_STATE_PENDING = 0;
  TEMP_EXECUTION_STATE_RUNNING = 1;
  TEMP_EXECUTION_STATE_SUCCEEDED = 2;
  TEMP_EXECUTION_STATE_FAILED = 3;
}

message TempExecutionFailure {
  int32 code = 1;
  string reason = 2;
  string detail = 3;
}

message TempExecutionInfo {
  string execution_uuid = 1;
  TempExecutionState state = 2;
  TemperatureReading reading = 3;
  TempExecutionFailure failure = 4;
}

message TempExecutionReference {
  string execution_uuid = 1;
}