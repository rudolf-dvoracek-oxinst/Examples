syntax = "proto3";import "SiLAFramework.proto";package sila2.oxfordinstruments.examples.temperaturefeature.v1;/* Example temperature feature supporting single measurements and a current temperature property. */service TemperatureFeature {  /* Perform a one-off temperature measurement and update the CurrentTemperature property. */  rpc MeasureTemperature (sila2.oxfordinstruments.examples.temperaturefeature.v1.MeasureTemperature_Parameters) returns (sila2.oxfordinstruments.examples.temperaturefeature.v1.MeasureTemperature_Responses) {}  /* Latest temperature reading. */  rpc Subscribe_CurrentTemperature (sila2.oxfordinstruments.examples.temperaturefeature.v1.Subscribe_CurrentTemperature_Parameters) returns (stream sila2.oxfordinstruments.examples.temperaturefeature.v1.Subscribe_CurrentTemperature_Responses) {}}/* Parameters for MeasureTemperature */message MeasureTemperature_Parameters {}/* Responses of MeasureTemperature */message MeasureTemperature_Responses {}/* Parameters for CurrentTemperature */message Subscribe_CurrentTemperature_Parameters {}/* Responses of CurrentTemperature */message Subscribe_CurrentTemperature_Responses {message CurrentTemperature_Struct {sila2.org.silastandard.Real ValueCelsius = 1;  /* Measured temperature value expressed in degrees Celsius. */sila2.org.silastandard.Integer TimestampUnixMs = 2;  /* Unix time in milliseconds when the sample was taken. */}sila2.oxfordinstruments.examples.temperaturefeature.v1.Subscribe_CurrentTemperature_Responses.CurrentTemperature_Struct CurrentTemperature = 1;  /* Latest temperature reading. */}