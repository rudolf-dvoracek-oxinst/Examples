syntax = "proto3";import "SiLAFramework.proto";package sila2.oxfordinstruments.examples.greetingfeature.v1;/* Example greeting feature offering a hello command and a last greeting property. */service GreetingFeature {  /* Return a greeting for the provided name (updates LastGreeting). */  rpc SayHello (sila2.oxfordinstruments.examples.greetingfeature.v1.SayHello_Parameters) returns (sila2.oxfordinstruments.examples.greetingfeature.v1.SayHello_Responses) {}  /* Most recent greeting returned by SayHello. */  rpc Subscribe_LastGreeting (sila2.oxfordinstruments.examples.greetingfeature.v1.Subscribe_LastGreeting_Parameters) returns (stream sila2.oxfordinstruments.examples.greetingfeature.v1.Subscribe_LastGreeting_Responses) {}}/* Parameters for SayHello */message SayHello_Parameters {sila2.org.silastandard.String Name = 1;  /* Name to greet. */}/* Responses of SayHello */message SayHello_Responses {}/* Parameters for LastGreeting */message Subscribe_LastGreeting_Parameters {}/* Responses of LastGreeting */message Subscribe_LastGreeting_Responses {message LastGreeting_Struct {sila2.org.silastandard.String Message = 1;  /* Greeting text. */sila2.org.silastandard.Integer TimestampUnixMs = 2;  /* Unix time (milliseconds) when the greeting was produced. */}sila2.oxfordinstruments.examples.greetingfeature.v1.Subscribe_LastGreeting_Responses.LastGreeting_Struct LastGreeting = 1;  /* Most recent greeting returned by SayHello. */}